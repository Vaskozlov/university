[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dilation-lab"
version = "0.1.0"
description = "3x3 binary image dilation: native Python and OpenCV implementations with validation and benchmarking"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
